name: Inspect page structure
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-pages.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 monitoring/inspect_pages.py
